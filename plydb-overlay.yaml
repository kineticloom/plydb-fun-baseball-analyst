        fields:
          - name: Name
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Name
            description: Player full name.

          - name: Tm
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Tm
            description: Team abbreviation (Baseball Reference format).
            ai_context:
              synonyms: ["team", "club"]

          - name: ERA
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: ERA
            description: Earned run average.

          - name: "SO/W"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: "\"SO/W\""
            description: Strikeout-to-walk ratio.
