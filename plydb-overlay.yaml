          - name: WAR
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: WAR
            description: Team pitching WAR.

      # -----------------------------------------------------------------------
      - name: standings
        source: standings.default.standings
        primary_key: [Season, DivisionIndex, Tm]
        description: >
          Division standings per season from Baseball Reference. One row per
          team. All divisions are concatenated into a single table with a
          DivisionIndex column to identify the division. Covers 1969+.
        ai_context:
          synonyms:
            - "division standings"
            - "standings"
            - "win-loss record"
            - "games behind"

          instructions: >
            DivisionIndex for post-1994 seasons: 0=AL East, 1=AL Central,
            2=AL West, 3=NL East, 4=NL Central, 5=NL West.
            Pre-1994 had only two divisions per league.
            W, L, W-L%, and GB are stored as proper numeric types (INT/DOUBLE)
            — no casting needed. GB is 0.0 for the division leader.
            'Tm' contains full team names (e.g. 'New York Yankees'), not
            abbreviations. It may include suffix markers for clinching.

        fields:
          - name: Season
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Season
            description: Season year (added by download script).
            dimension:
              is_time: true

          - name: DivisionIndex
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: DivisionIndex
            description: >
              Division identifier (0-5). Post-1994: 0=AL East, 1=AL Central,
              2=AL West, 3=NL East, 4=NL Central, 5=NL West.
            ai_context:
              synonyms: ["division", "AL East", "NL West", "division id"]

          - name: Tm
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Tm
            description: Team name or abbreviation.
            ai_context:
              synonyms: ["team", "franchise", "club"]

          - name: W
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: W
            description: Wins (integer).

          - name: L
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: L
            description: Losses (integer).

          - name: "W-L%"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: "\"W-L%\""
            description: Win percentage (float, e.g. 0.580).
            ai_context:
              synonyms: ["winning percentage", "win pct", "win rate"]

          - name: GB
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: GB
            description: >
              Games behind the division leader (float). 0.0 for the
              division leader.
            ai_context:
              synonyms: ["games behind", "GB", "back"]

      # -----------------------------------------------------------------------
      - name: schedule
        source: schedule.default.schedule
        primary_key: [Season, Team, Gm]
        description: >
          Game-by-game schedule and results for a specific team-season from
          Baseball Reference. One row per game. Includes date, opponent,
          home/away, runs scored and allowed, outcome (W/L/T), running record,
          starting pitchers, attendance, and game duration.
        ai_context:
          synonyms:
            - "game log"
            - "game results"
            - "schedule"
            - "win loss record"

          instructions: >
            The Season and Team columns are added by the download script.
            The Home_Away column is '@' for away games and 'Home' for home games.
            W/L column values include walk-off wins ('W-wo') and losses.
            Future games in an incomplete season will have blank result fields.
            Winning pitcher (Win), losing pitcher (Loss), and save (Save)
            columns contain pitcher names, not IDs.

        fields:
          - name: Season
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Season
            description: Season year (added by download script).
            dimension:
              is_time: true

          - name: Team
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Team
            description: Team abbreviation (added by download script).
            ai_context:
              synonyms: ["team", "franchise"]

          - name: Date
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Date
            description: Game date (may include day-of-week prefix, e.g. "Monday, Apr 1").
            dimension:
              is_time: true
            ai_context:
              synonyms: ["game date", "date"]

          - name: Opp
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Opp
            description: Opponent team abbreviation.
            ai_context:
              synonyms: ["opponent", "opposing team", "vs"]

          - name: R
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: R
            description: Runs scored by the tracked team.
            ai_context:
              synonyms: ["runs scored", "runs for"]

          - name: RA
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: RA
            description: Runs allowed (opponent runs scored).
            ai_context:
              synonyms: ["runs allowed", "runs against"]

          - name: "W/L"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: "\"W/L\""
            description: >
              Game result: 'W' (win), 'L' (loss), 'T' (tie).
              'W-wo' and 'L-wo' indicate walk-off outcomes.
            ai_context:
              synonyms: ["result", "win", "loss", "outcome"]

          - name: Attendance
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Attendance
            description: Game attendance (may be blank for away games in some seasons).
            ai_context:
              synonyms: ["attendance", "crowd", "fans"]

          - name: Streak
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Streak
            description: >
              Current win or loss streak at end of game (integer).
              Positive = win streak length; negative = loss streak length.
            ai_context:
              synonyms: ["streak", "hot streak", "skid"]

      # -----------------------------------------------------------------------
      - name: player_ids
        source: player_ids.default.player_ids
        primary_key: [key_mlbam]
        description: >
          Chadwick Bureau cross-system player ID register. One row per person.
          Maps MLBAM IDs (used in Statcast batter/pitcher columns) to FanGraphs,
          Baseball Reference, and Retrosheet IDs, plus player names and MLB
          career years. Essential bridge table for joining Statcast data to
          named player records.
        ai_context:
          synonyms:
            - "player IDs"
            - "player register"
            - "Chadwick"
            - "MLBAM ID"
            - "player lookup"

          instructions: >
            To look up a player's name from a Statcast MLBAM ID:
              JOIN player_ids ON statcast.batter = player_ids.key_mlbam
            To link FanGraphs stats to Statcast:
              JOIN player_ids ON batting_stats.IDfg = player_ids.key_fangraphs
            To link BBRef stats to Statcast:
              JOIN player_ids ON batting_stats_bref.mlbID = player_ids.key_mlbam
            Note: key_mlbam is NULL for non-MLB players in the register.
            Use name_first and name_last for name matching.

        fields:
          - name: key_mlbam
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: key_mlbam
            description: >
              MLBAM (MLB Advanced Media) numeric player ID. Used in Statcast's
              'batter' and 'pitcher' columns. The primary key for joining
              Statcast data to this register.
            ai_context:
              synonyms: ["MLBAM ID", "MLB ID", "Baseball Savant ID"]

          - name: key_fangraphs
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: key_fangraphs
            description: FanGraphs player ID. Matches 'IDfg' in batting_stats and pitching_stats.
            ai_context:
              synonyms: ["FanGraphs ID", "FG ID"]

          - name: key_bbref
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: key_bbref
            description: Baseball Reference player ID (e.g. 'troutmi01').
            ai_context:
              synonyms: ["Baseball Reference ID", "BBRef ID", "bref ID"]

          - name: key_retro
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: key_retro
            description: Retrosheet player ID.
            ai_context:
              synonyms: ["Retrosheet ID"]

          - name: name_last
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: name_last
            description: Player last name.
            ai_context:
              synonyms: ["last name", "surname"]

          - name: name_first
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: name_first
            description: Player first name.
            ai_context:
              synonyms: ["first name", "given name"]

          - name: mlb_played_first
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: mlb_played_first
            description: First MLB season the player appeared.
            dimension:
              is_time: true
            ai_context:
              synonyms: ["debut year", "first season", "rookie year"]

          - name: mlb_played_last
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: mlb_played_last
            description: Most recent MLB season the player appeared.
            dimension:
              is_time: true
            ai_context:
              synonyms: ["last season", "final season"]
