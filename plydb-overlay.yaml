          - name: "wRC+"
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: "\"wRC+\""
            description: >
              Team park-adjusted offensive value. 100 = league average.
              Best single metric for comparing team offenses.
            ai_context:
              synonyms: ["team offense quality", "wRC+"]

          - name: WAR
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: WAR
