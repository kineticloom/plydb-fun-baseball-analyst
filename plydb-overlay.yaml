          - name: ERA
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: ERA
            description: Team ERA.

          - name: FIP
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: FIP
            description: Team FIP. Better than ERA for comparing staff quality.
            ai_context:
