          FanGraphs batting_stats (wRC+) for park-adjusted metrics.
          Team column is 'Tm'. Player MLBAM ID is in the 'mlbID' column.
        ai_context:
          synonyms:
            - "Baseball Reference batting"
            - "bref batting"

        fields:
          - name: Name
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Name
            description: Player full name.

          - name: Tm
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: Tm
            description: Team abbreviation (Baseball Reference format).
            ai_context:
              synonyms: ["team", "club"]

          - name: BA
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: BA
            description: Batting average.
            ai_context:
              synonyms: ["batting average", "AVG", "average"]

          - name: mlbID
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: mlbID
            description: MLBAM player ID. Matches player_ids.key_mlbam and statcast.batter/pitcher.
            ai_context:
              synonyms: ["MLBAM ID", "MLB ID"]

      # -----------------------------------------------------------------------
      - name: pitching_stats_bref
        source: pitching_stats_bref.default.pitching_stats_bref
        primary_key: [Name, Tm]
        description: >
          Baseball Reference season-level pitching statistics (2008+). One row
          per player. Note: the pybaseball output does NOT include ERA+; use
          FanGraphs pitching_stats (FIP, xFIP) for park-adjusted metrics.
          Team column is 'Tm'. Includes SO/W ratio and BAbip.
          Player MLBAM ID is in the 'mlbID' column.
        ai_context:
          synonyms:
            - "Baseball Reference pitching"
