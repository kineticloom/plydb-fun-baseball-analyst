          - name: mlbID
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: mlbID
            description: MLBAM player ID. Matches player_ids.key_mlbam and statcast.pitcher.
            ai_context:
              synonyms: ["MLBAM ID", "MLB ID"]

